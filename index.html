<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Maxi IA</title>
  <link rel="manifest" href="./manifest.json">
  <style>
    /* ── ESTILOS GENERALES Y OSCUROS ── */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background-color: #121212; color: #e0e0e0; display: flex; height: 100vh; overflow: hidden; }
    
    /* Layout */
    #sidebar { width: 260px; background-color: #1a1a1a; display: flex; flex-direction: column; border-right: 1px solid #2d2d2d; transition: transform 0.3s ease; z-index: 10; }
    #main-content { flex: 1; display: flex; flex-direction: column; position: relative; background-color: #121212; }
    
    /* Header */
    header { height: 56px; background-color: #1a1a1a; border-bottom: 1px solid #2d2d2d; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; }
    header h1 { font-size: 18px; color: #4A90D9; font-weight: 600; }
    
    /* Chat Box */
    #chat-box { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; font-size: 15px; line-height: 1.5; word-break: break-word; }
    .msg.user { background-color: #3b82f6; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
    .msg.ai { background-color: #1e1e1e; color: #e0e0e0; align-self: flex-start; border-bottom-left-radius: 4px; border: 1px solid #2d2d2d; }
    
    /* Contenedor de Entrada */
    #input-wrap { padding: 12px 16px; background-color: #1a1a1a; border-top: 1px solid #2d2d2d; display: flex; gap: 8px; align-items: flex-end; }
    textarea { flex: 1; background-color: #262626; border: 1px solid #3a3a3a; border-radius: 24px; color: #fff; padding: 10px 16px; font-size: 15px; resize: none; max-height: 120px; outline: none; }
    button { background-color: #3b82f6; border: none; color: white; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
    button:disabled { background-color: #444; cursor: not-allowed; }
    
    /* Sidebar Componentes */
    .btn-nuevo { background-color: #3b82f6; border-radius: 8px; width: auto; height: 40px; margin: 12px; font-weight: bold; font-size: 14px; }
    #lista-chats { flex: 1; overflow-y: auto; padding: 0 8px; }
    .item-chat { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-radius: 8px; cursor: pointer; margin-bottom: 4px; font-size: 14px; }
    .item-chat.activo { background-color: #2d2d2d; color: #3b82f6; }
    .chat-title { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chat-actions button { background: none; width: auto; height: auto; font-size: 14px; margin-left: 6px; display: inline; }
    .btn-borrar-todo { background-color: #cf6679; width: auto; height: 36px; margin: 12px; border-radius: 6px; font-weight: bold; }

    /* Indicador de carga (dots) */
    .typing { display: flex; gap: 4px; align-items: center; width: fit-content; }
    .dot { width: 8px; height: 8px; background-color: #888; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1.0); } }

    /* Modal */
    #modal-wrap { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); display:none; align-items:center; justify-content:center; z-index:100; }
    #modal-wrap.show { display: flex; }
    .modal { background:#1a1a1a; padding:20px; border-radius:12px; width:90%; max-width:400px; border:1px solid #2d2d2d; }
    .modal input { width:100%; padding:10px; background:#262626; border:1px solid #3a3a3a; color:#fff; border-radius:6px; margin-bottom:12px; outline:none; }
    .modal-btns { display:flex; justify-content:flex-end; gap:8px; }
    .modal-btns button { width:auto; height:auto; padding:8px 16px; border-radius:6px; }

    /* Botón Hamburguesa Móvil */
    #btn-toggle { background: none; font-size: 20px; width: auto; height: auto; }

    /* Estilos de código formateado */
    pre { background-color: #262626; padding: 10px; border-radius: 8px; overflow-x: auto; margin: 8px 0; border: 1px solid #3a3a3a; }
    code { font-family: 'Courier New', Courier, monospace; color: #f69d50; }

    /* Responsivo Tablet/Celular */
    @media (max-width: 600px) {
      #sidebar { position: absolute; left: 0; top: 0; bottom: 0; transform: translateX(-100%); }
      #sidebar.open { transform: translateX(0); }
    }
  </style>
</head>
<body>

    <button class="btn-nuevo" onclick="nuevoChat()">+ Nuevo Chat</button>
    <div id="lista-chats"></div>
    <button id="btn-instalar" class="btn-nuevo" style="display:none; background-color:#10b981;" onclick="instalarApp()">📥 Instalar App</button>
    <button class="btn-borrar-todo" onclick="borrarTodo()">🗑 Borrar todo</button>
  </div>

      </div>
    </div>
  </div>
